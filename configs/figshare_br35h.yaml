# 2D four-class benchmark: FigShare (with masks) merged with Br35H.
base: base.yaml
experiment: figshare_br35h
output_dir: runs/figshare_br35h
model:
  spatial_dims: 2
  in_channels: 1                       # T1-CE slices
  modality_names: "T1-CE"
  voxel_volume_mm3: 1.0                # pixel spacing unknown -> areas in pixel units / 100
  dfcam_patch_sizes: [8, 16]
train:
  stage: vision
  epochs: 300
  batch_size: 32
data:
  type: figshare+folder
  size: [224, 224]
  test_fraction: 0.2
  seed: 42
  figshare:
    root: data/figshare                # *.mat files (cjdata)
    mask_label: 1                      # binary tumour masks -> label 1
  folder:
    root: data/Br35H                   # Br35H/{yes,no}
    class_map: {no: 3, yes: -100}      # 'yes' has no tumour type -> ignored by L_cls
