[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mqda-net"
version = "0.1.0"
description = "MQDA-Net: quantum-enhanced dual-branch framework for unified brain tumor segmentation, classification and structured radiology report generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1", "numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "pyyaml>=6.0",
  "tqdm>=4.66", "nibabel>=5.1", "h5py>=3.9", "pillow>=10.0", "transformers>=4.45",
  "peft>=0.12", "accelerate>=0.33", "safetensors>=0.4", "huggingface_hub>=0.24",
]

[project.optional-dependencies]
quantum = ["pennylane>=0.35"]
metrics = ["nltk>=3.8", "rouge-score>=0.1.2", "bert-score>=0.3.13", "radgraph>=0.1.13"]
preprocess = ["SimpleITK>=2.3"]
distributed = ["deepspeed>=0.14", "bitsandbytes>=0.43"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["mqda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
